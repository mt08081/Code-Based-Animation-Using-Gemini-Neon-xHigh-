    class ShorelineSoundEngine {
      constructor() {
        this.ctx = null;
        this.ready = false;
        this.monitorEnabled = false;
        this.exportActive = false;
        this.masterVol = 0.88;
      }

      async ensureReady() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;

        if (!this.ctx) {
          this.ctx = new AC();
          this._buildGraph();
        }
        if (this.ctx.state === 'suspended') {
          await this.ctx.resume();
        }
        this.ready = true;
        return true;
      }

      _createNoiseBuffer(seconds, pink) {
        const sr = this.ctx.sampleRate;
        const len = Math.floor(sr * seconds);
        const buf = this.ctx.createBuffer(2, len, sr);
        for (let ch = 0; ch < 2; ch++) {
          const d = buf.getChannelData(ch);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < len; i++) {
            const w = seededRand(8000 + ch * 99991 + i) * 2 - 1;
            if (!pink) {
              d[i] = w;
            } else {
              b0 = 0.99886 * b0 + w * 0.0555179;
              b1 = 0.99332 * b1 + w * 0.0750759;
              b2 = 0.96900 * b2 + w * 0.1538520;
              b3 = 0.86650 * b3 + w * 0.3104856;
              b4 = 0.55000 * b4 + w * 0.5329522;
              b5 = -0.7616 * b5 - w * 0.0168980;
              d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
              b6 = w * 0.115926;
            }
          }
        }
        return buf;
      }

      _createReverbIR(seconds) {
        const sr = this.ctx.sampleRate;
        const len = Math.floor(sr * seconds);
        const buf = this.ctx.createBuffer(2, len, sr);
        for (let ch = 0; ch < 2; ch++) {
          const d = buf.getChannelData(ch);
          let lp = 0;
          for (let i = 0; i < len; i++) {
            const env = Math.pow(1 - i / len, 2.7);
            const raw = (seededRand(40000 + ch * 65537 + i) * 2 - 1) * env;
            lp = lp * 0.62 + raw * 0.38;
            d[i] = lp;
          }
        }
        return buf;
      }

      _panner(pan) {
        if (this.ctx.createStereoPanner) {
          const p = this.ctx.createStereoPanner();
          p.pan.value = clamp(pan, -1, 1);
          return p;
        }
        const g = this.ctx.createGain();
        return g;
      }

      _buildGraph() {
        const ctx = this.ctx;
        this.whiteNoise = this._createNoiseBuffer(2.5, false);
        this.pinkNoise = this._createNoiseBuffer(4.0, true);

        // Master output bus with brickwall limiter -> splits cleanly to Speakers + WebM Export
        this.masterSum = ctx.createGain();
        this.masterSum.gain.value = 1.0;

        this.compressor = ctx.createDynamicsCompressor();
        this.compressor.threshold.value = -10;
        this.compressor.knee.value = 12;
        this.compressor.ratio.value = 8;
        this.compressor.attack.value = 0.003;
        this.compressor.release.value = 0.14;

        this.monitorGain = ctx.createGain();
        this.monitorGain.gain.value = 0;

        this.exportGain = ctx.createGain();
        this.exportGain.gain.value = 0;

        this.exportDest = ctx.createMediaStreamDestination();

        this.masterSum.connect(this.compressor);
        this.compressor.connect(this.monitorGain);
        this.monitorGain.connect(ctx.destination);
        this.compressor.connect(this.exportGain);
        this.exportGain.connect(this.exportDest);

        // SFX bus with subtle coastal/hall reverb send
        this.sfxBus = ctx.createGain();
        this.sfxBus.gain.value = 1.0;

        this.sfxDry = ctx.createGain();
        this.sfxDry.gain.value = 0.86;
        this.sfxBus.connect(this.sfxDry);
        this.sfxDry.connect(this.masterSum);

        this.reverbSend = ctx.createGain();
        this.reverbSend.gain.value = 0.28;
        this.convolver = ctx.createConvolver();
        this.convolver.buffer = this._createReverbIR(1.35);
        this.sfxBus.connect(this.reverbSend);
        this.reverbSend.connect(this.convolver);
        this.convolver.connect(this.masterSum);

        // Continuous ambient bed bus (gates cleanly to 0 when paused)
        this.bedMaster = ctx.createGain();
        this.bedMaster.gain.value = 0;
        this.bedMaster.connect(this.masterSum);

        // 1. Night Ocean Surf Layer (filtered stereo pink noise modulated by wave swell)
        this.surfSrc = ctx.createBufferSource();
        this.surfSrc.buffer = this.pinkNoise;
        this.surfSrc.loop = true;

        this.surfFilter = ctx.createBiquadFilter();
        this.surfFilter.type = 'lowpass';
        this.surfFilter.frequency.value = 460;
        this.surfFilter.Q.value = 0.7;

        this.surfGain = ctx.createGain();
        this.surfGain.gain.value = 0.26;

        this.surfSrc.connect(this.surfFilter);
        this.surfFilter.connect(this.surfGain);
        this.surfGain.connect(this.bedMaster);
        this.surfSrc.start();

        // 2. Atmospheric Night Drone + Dissonant Awakening Pad (D2=73.4Hz, A2=110Hz, Tension Eb2=77.8Hz)
        this.droneFilter = ctx.createBiquadFilter();
        this.droneFilter.type = 'lowpass';
        this.droneFilter.frequency.value = 220;
        this.droneFilter.Q.value = 1.2;

        this.droneGain = ctx.createGain();
        this.droneGain.gain.value = 0.14;

        this.droneFilter.connect(this.droneGain);
        this.droneGain.connect(this.bedMaster);

        this.droneOsc1 = ctx.createOscillator();
        this.droneOsc1.type = 'triangle';
        this.droneOsc1.frequency.value = 73.42; // D2
        const d1g = ctx.createGain();
        d1g.gain.value = 0.55;
        this.droneOsc1.connect(d1g);
        d1g.connect(this.droneFilter);
        this.droneOsc1.start();

        this.droneOsc2 = ctx.createOscillator();
        this.droneOsc2.type = 'sine';
        this.droneOsc2.frequency.value = 110.0; // A2
        const d2g = ctx.createGain();
        d2g.gain.value = 0.32;
        this.droneOsc2.connect(d2g);
        d2g.connect(this.droneFilter);
        this.droneOsc2.start();

        // Eerie dissonant tension oscillator (fades in during Act III descent & Act IV eclipse)
        this.tensionOsc = ctx.createOscillator();
        this.tensionOsc.type = 'sawtooth';
        this.tensionOsc.frequency.value = 77.78; // Eb2 minor-second rub against D2
        this.tensionFilter = ctx.createBiquadFilter();
        this.tensionFilter.type = 'bandpass';
        this.tensionFilter.frequency.value = 190;
        this.tensionFilter.Q.value = 2.4;
        this.tensionGain = ctx.createGain();
        this.tensionGain.gain.value = 0.0;
        this.tensionOsc.connect(this.tensionFilter);
        this.tensionFilter.connect(this.tensionGain);
        this.tensionGain.connect(this.bedMaster);
        this.tensionOsc.start();

        // High ethereal ringing shimmer during Act IV eclipse & inversion
        this.ringOsc = ctx.createOscillator();
        this.ringOsc.type = 'sine';
        this.ringOsc.frequency.value = 2349.3; // D7 ghost harmonic
        this.ringGain = ctx.createGain();
        this.ringGain.gain.value = 0.0;
        this.ringOsc.connect(this.ringGain);
        this.ringGain.connect(this.bedMaster);
        this.ringOsc.start();
      }

      setMonitorEnabled(enabled) {
        this.monitorEnabled = enabled;
        if (!this.ready) return;
        const now = this.ctx.currentTime;
        this.monitorGain.gain.setTargetAtTime(enabled ? this.masterVol : 0, now, 0.025);
      }

      setExportMode(active) {
        this.exportActive = active;
        if (!this.ready) return;
        const now = this.ctx.currentTime;
        this.exportGain.gain.cancelScheduledValues(now);
        this.exportGain.gain.setTargetAtTime(active ? this.masterVol : 0, now, 0.012);
      }

      fadeOutExport(sec = 0.035) {
        if (!this.ready) return;
        const now = this.ctx.currentTime;
        this.exportGain.gain.cancelScheduledValues(now);
        this.exportGain.gain.setValueAtTime(this.exportGain.gain.value, now);
        this.exportGain.gain.linearRampToValueAtTime(0, now + sec);
      }

      getExportAudioTrack() {
        return this.exportDest ? this.exportDest.stream.getAudioTracks()[0] : null;
      }

      updateContinuous(st, active) {
        if (!this.ready) return;
        const now = this.ctx.currentTime;
        const audible = active && (this.monitorEnabled || this.exportActive);
        this.bedMaster.gain.setTargetAtTime(audible ? 1.0 : 0.0, now, 0.03);
        if (!audible) return;

        // 1. Ocean surf swells in exact sync with visual shoreline foam (3 waves per 9.0s)
        const waveSwell = 0.5 + 0.5 * Math.sin(st.u * Math.PI * 2 * 3);
        const surfDuck = st.invertMoon ? 0.25 : (1 - smoothstep(7.35, 8.12, st.t) * 0.65);
        this.surfFilter.frequency.setTargetAtTime(lerp(310, 680, waveSwell) * (0.65 + 0.35 * surfDuck), now, 0.05);
        this.surfGain.gain.setTargetAtTime(lerp(0.16, 0.29, waveSwell) * surfDuck, now, 0.05);

        // 2. Night drone drops octave/darkens during Act IV inversion
        const baseFreq = st.invertMoon ? 36.71 : 73.42; // D1 deep sub on inversion vs D2 calm
        this.droneOsc1.frequency.setTargetAtTime(baseFreq, now, 0.04);
        this.droneOsc2.frequency.setTargetAtTime(st.invertMoon ? 55.0 : 110.0, now, 0.04);
        this.droneFilter.frequency.setTargetAtTime(st.invertMoon ? 340 : lerp(180, 320, st.tension), now, 0.05);
        this.droneGain.gain.setTargetAtTime(st.invertMoon ? 0.36 : lerp(0.12, 0.22, st.tension), now, 0.04);

        // 3. Dissonant tension pad rises across Act III descent & swells in Act IV
        const descentTension = smoothstep(5.2, 6.95, st.t);
        const tAmp = st.invertMoon ? 0.24 : descentTension * 0.16 * (1 - st.slashAmount * 0.6);
        const tFreq = st.invertMoon ? 41.2 : lerp(77.78, 87.31, descentTension);
        this.tensionOsc.frequency.setTargetAtTime(tFreq, now, 0.05);
        this.tensionFilter.frequency.setTargetAtTime(st.invertMoon ? 460 : lerp(170, 520, descentTension), now, 0.05);
        this.tensionGain.gain.setTargetAtTime(tAmp, now, 0.04);

        // 4. Eerie high-frequency eclipse ring during Act IV stare-down & inversion
        const ringAmp = st.invertMoon
          ? 0.032
          : smoothstep(7.45, 8.15, st.t) * 0.026;
        this.ringOsc.frequency.setTargetAtTime(st.invertMoon ? 2489.0 : lerp(2180, 2380, smoothstep(7.45, 8.15, st.t)), now, 0.05);
        this.ringGain.gain.setTargetAtTime(ringAmp, now, 0.04);
      }

      /**
       * Dispatch all discrete cues in (prevT, curT], handling seamless loop wrap cleanly.
       */
      triggerCuesBetween(prevT, curT, glitchScale) {
        if (!this.ready || (!this.monitorEnabled && !this.exportActive)) return;

        // Avoid cue spam if user drags the timeline scrubber across a wide span
        const wrapped = curT < prevT;
        const delta = wrapped ? (DURATION - prevT + curT) : (curT - prevT);
        if (delta <= 0 || delta > 0.35) return;

        for (let i = 0; i < AUDIO_CUES.length; i++) {
          const c = AUDIO_CUES[i];
          const hit = wrapped
            ? (c.t > prevT || c.t <= curT)
            : (c.t > prevT && c.t <= curT);
          if (hit) {
            this._playCue(c, glitchScale);
          }
        }
      }

      _playCue(cue, glitchScale) {
        const gScale = 0.2 + 0.8 * clamp(glitchScale, 0, 1.5);
        switch (cue.type) {
          case 'footstep': this._sfxFootstep(cue.pan, cue.gain, cue.seed); break;
          case 'postWhoosh': this._sfxPostWhoosh(cue.dur); break;
          case 'glitchTremor': this._sfxGlitchTremor(cue.intensity * gScale, cue.pan); break;
          case 'teleportZap': this._sfxTeleportZap(cue.pan, cue.pitch, cue.muffled, gScale); break;
          case 'cloudsAwaken': this._sfxCloudsAwaken(); break;
          case 'eyeGlance': this._sfxEyeGlance(cue.pan, cue.freq); break;
          case 'slashIntake': this._sfxSlashIntake(gScale); break;
          case 'diagonalSlash': this._sfxDiagonalSlash(gScale); break;
          case 'heartbeat': this._sfxHeartbeat(cue.gain); break;
          case 'inversionDrop': this._sfxInversionDrop(gScale); break;
          case 'invertCrackle': this._sfxInvertCrackle(cue.pan, gScale); break;
          case 'snapCut': this._sfxSnapCut(gScale); break;
        }
      }

      _sfxFootstep(pan, gainAmt, seed) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const panner = this._panner(pan);
        panner.connect(this.sfxDry); // Keep footsteps dry & grounded

        // Soft muffled heel thud
        const osc = ctx.createOscillator();
        const og = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(92 + (seed % 3) * 8, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.09);
        og.gain.setValueAtTime(0.0001, now);
        og.gain.linearRampToValueAtTime(0.11 * gainAmt, now + 0.012);
        og.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
        osc.connect(og);
        og.connect(panner);
        osc.start(now);
        osc.stop(now + 0.12);

        // Granular soft beach sand crunch
        const src = ctx.createBufferSource();
        src.buffer = this.pinkNoise;
        const filt = ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.frequency.setValueAtTime(1550 + (seed % 4) * 210, now);
        filt.Q.value = 1.6;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.0001, now);
        ng.gain.linearRampToValueAtTime(0.14 * gainAmt, now + 0.022);
        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        src.connect(filt);
        filt.connect(ng);
        ng.connect(panner);
        src.start(now, (seed * 0.23) % 2.5, 0.16);
      }

      _sfxPostWhoosh(dur) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const src = ctx.createBufferSource();
        src.buffer = this.pinkNoise;

        const filt = ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.Q.value = 1.9;
        filt.frequency.setValueAtTime(140, now);
        filt.frequency.exponentialRampToValueAtTime(360, now + dur * 0.45);
        filt.frequency.exponentialRampToValueAtTime(110, now + dur);

        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.32, now + dur * 0.42);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        const panner = this._panner(-0.75);
        if (panner.pan) {
          panner.pan.setValueAtTime(-0.75, now);
          panner.pan.linearRampToValueAtTime(0.75, now + dur);
        }

        src.connect(filt);
        filt.connect(g);
        g.connect(panner);
        panner.connect(this.sfxDry);
        src.start(now, 0.4, dur + 0.05);
      }

      _sfxGlitchTremor(intensity, pan) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const panner = this._panner(pan);
        panner.connect(this.sfxBus);

        // Short digital static burst
        const src = ctx.createBufferSource();
        src.buffer = this.whiteNoise;
        const hp = ctx.createBiquadFilter();
        hp.type = 'bandpass';
        hp.frequency.setValueAtTime(2600 + intensity * 1400, now);
        hp.Q.value = 3.2;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.0001, now);
        ng.gain.linearRampToValueAtTime(0.16 * intensity, now + 0.006);
        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);
        src.connect(hp);
        hp.connect(ng);
        ng.connect(panner);
        src.start(now, 0.2, 0.1);

        // Stepped micro FM blip
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.setValueAtTime(980, now + 0.025);
        osc.frequency.setValueAtTime(260, now + 0.05);
        const og = ctx.createGain();
        og.gain.setValueAtTime(0.05 * intensity, now);
        og.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        osc.connect(og);
        og.connect(panner);
        osc.start(now);
        osc.stop(now + 0.09);
      }

      _sfxTeleportZap(pan, pitch, muffled, gScale) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const panner = this._panner(pan);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = muffled ? 1400 : 6800;
        panner.connect(lp);
        lp.connect(this.sfxBus);

        // Crisp electronic warp chirp (stepped frequencies for glitchy feel)
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280 * pitch, now);
        osc.frequency.setValueAtTime(1120 * pitch, now + 0.022);
        osc.frequency.exponentialRampToValueAtTime(190 * pitch, now + 0.14);

        const og = ctx.createGain();
        og.gain.setValueAtTime(0.0001, now);
        og.gain.linearRampToValueAtTime(0.16 * gScale, now + 0.008);
        og.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
        osc.connect(og);
        og.connect(panner);
        osc.start(now);
        osc.stop(now + 0.16);

        // Static rip transient
        const src = ctx.createBufferSource();
        src.buffer = this.whiteNoise;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(3400 * pitch, now);
        bp.Q.value = 1.8;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.22 * gScale, now);
        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.095);
        src.connect(bp);
        bp.connect(ng);
        ng.connect(panner);
        src.start(now, (pitch * 0.7) % 1.5, 0.11);
      }

      _sfxCloudsAwaken() {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        // Eerie hollow choir-like chord (D4 + Eb4 + Ab4) swelling softly as eyelids part
        const freqs = [293.66, 311.13, 415.30];
        freqs.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          osc.type = idx === 1 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(f * 0.985, now);
          osc.frequency.linearRampToValueAtTime(f, now + 0.75);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, now);
          g.gain.linearRampToValueAtTime(0.055, now + 0.35);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);

          const panner = this._panner(idx === 0 ? -0.45 : idx === 2 ? 0.45 : 0);
          osc.connect(g);
          g.connect(panner);
          panner.connect(this.sfxBus);
          osc.start(now);
          osc.stop(now + 1.3);
        });
      }

      _sfxEyeGlance(pan, freq) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const panner = this._panner(pan);
        panner.connect(this.sfxBus);

        // Glassy high-Q resonant sweep mimicking a sudden giant eye glance
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.32, now + 0.14);

        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.065, now + 0.025);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);

        osc.connect(g);
        g.connect(panner);
        osc.start(now);
        osc.stop(now + 0.26);
      }

      _sfxSlashIntake(gScale) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        // Quick reverse-swell suction right before the diagonal moon slash
        const src = ctx.createBufferSource();
        src.buffer = this.whiteNoise;
        const filt = ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.Q.value = 3.5;
        filt.frequency.setValueAtTime(420, now);
        filt.frequency.exponentialRampToValueAtTime(4200, now + 0.16);

        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.24 * gScale, now + 0.155);
        g.gain.linearRampToValueAtTime(0.0001, now + 0.175);

        src.connect(filt);
        filt.connect(g);
        g.connect(this.sfxBus);
        src.start(now, 0.3, 0.19);
      }

      _sfxDiagonalSlash(gScale) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const panner = this._panner(-0.85);
        if (panner.pan) {
          panner.pan.setValueAtTime(-0.85, now);
          panner.pan.linearRampToValueAtTime(0.85, now + 0.26);
        }
        panner.connect(this.sfxBus);

        // 1. Razor-sharp metallic whip sweep
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(2400, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.28);
        const og = ctx.createGain();
        og.gain.setValueAtTime(0.24 * gScale, now);
        og.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
        osc.connect(og);
        og.connect(panner);
        osc.start(now);
        osc.stop(now + 0.34);

        // 2. Blinding white-noise digital tear
        const src = ctx.createBufferSource();
        src.buffer = this.whiteNoise;
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.setValueAtTime(1600, now);
        hp.frequency.exponentialRampToValueAtTime(420, now + 0.26);
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.38 * gScale, now);
        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);
        src.connect(hp);
        hp.connect(ng);
        ng.connect(panner);
        src.start(now, 0.1, 0.32);

        // 3. Tight center sub-punch impact
        const sub = ctx.createOscillator();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(140, now);
        sub.frequency.exponentialRampToValueAtTime(34, now + 0.22);
        const sg = ctx.createGain();
        sg.gain.setValueAtTime(0.42, now);
        sg.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
        sub.connect(sg);
        sg.connect(this.sfxDry);
        sub.start(now);
        sub.stop(now + 0.28);
      }

      _sfxHeartbeat(gainAmt) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(66, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.16);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.32 * gainAmt, now + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.20);
        osc.connect(g);
        g.connect(this.sfxDry);
        osc.start(now);
        osc.stop(now + 0.22);
      }

      _sfxInversionDrop(gScale) {
        const ctx = this.ctx;
        const now = ctx.currentTime;

        // 1. Massive cinema sub-bass impact drop (120Hz -> 32Hz)
        const sub = ctx.createOscillator();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(118, now);
        sub.frequency.exponentialRampToValueAtTime(32, now + 0.65);
        const sg = ctx.createGain();
        sg.gain.setValueAtTime(0.62, now);
        sg.gain.exponentialRampToValueAtTime(0.0001, now + 0.78);
        sub.connect(sg);
        sg.connect(this.sfxDry);
        sub.start(now);
        sub.stop(now + 0.80);

        // 2. Inverted-reality metallic horror sting (detuned dissonant tritone + minor 9th)
        const stingFreqs = [146.83, 207.65, 311.13, 622.25];
        stingFreqs.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          osc.type = idx < 2 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(f * 1.03, now);
          osc.frequency.exponentialRampToValueAtTime(f * 0.96, now + 0.72);

          const bp = ctx.createBiquadFilter();
          bp.type = 'lowpass';
          bp.frequency.setValueAtTime(2400, now);
          bp.frequency.exponentialRampToValueAtTime(520, now + 0.72);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, now);
          g.gain.linearRampToValueAtTime(0.11, now + 0.014);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.76);

          const panner = this._panner((idx - 1.5) * 0.45);
          osc.connect(bp);
          bp.connect(g);
          g.connect(panner);
          panner.connect(this.sfxBus);
          osc.start(now);
          osc.stop(now + 0.78);
        });

        // 3. Sharp crunch static flash at exact inversion moment
        const src = ctx.createBufferSource();
        src.buffer = this.whiteNoise;
        const filt = ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.frequency.value = 1900;
        filt.Q.value = 1.2;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.32 * gScale, now);
        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
        src.connect(filt);
        filt.connect(ng);
        ng.connect(this.sfxBus);
        src.start(now, 0.5, 0.18);
      }

      _sfxInvertCrackle(pan, gScale) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const panner = this._panner(pan);
        panner.connect(this.sfxBus);

        const src = ctx.createBufferSource();
        src.buffer = this.whiteNoise;
        const hp = ctx.createBiquadFilter();
        hp.type = 'bandpass';
        hp.frequency.value = 3200;
        hp.Q.value = 2.8;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.18 * gScale, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);
        src.connect(hp);
        hp.connect(g);
        g.connect(panner);
        src.start(now, Math.abs(pan), 0.075);
      }

      _sfxSnapCut(gScale) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        // Crisp 60ms CRT/tape snap cut back to serene shore
        const src = ctx.createBufferSource();
        src.buffer = this.whiteNoise;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(4400, now);
        bp.frequency.exponentialRampToValueAtTime(880, now + 0.055);
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.28 * gScale, now);
        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);
        src.connect(bp);
        bp.connect(ng);
        ng.connect(this.sfxDry);
        src.start(now, 0.9, 0.07);
      }
    }

    const soundEngine = new ShorelineSoundEngine();

    /* =========================================================================
     * 8. STUDIO PLAYBACK LOOP, TIMELINE CONTROLS & EXPORTERS
     * =======================================================================*/
    const playPauseBtn = document.getElementById('playPauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const soundBtn = document.getElementById('soundBtn');
    const actPill = document.getElementById('actPill');
    const timeReadout = document.getElementById('timeReadout');
    const timelineTrack = document.getElementById('timelineTrack');
    const timelineProgress = document.getElementById('timelineProgress');
    const timelineThumb = document.getElementById('timelineThumb');
    const glitchSlider = document.getElementById('glitchSlider');
    const glitchVal = document.getElementById('glitchVal');
    const exportWebmBtn = document.getElementById('exportWebmBtn');
    const exportGifBtn = document.getElementById('exportGifBtn');
    const exportOverlay = document.getElementById('exportOverlay');
    const exportLabel = document.getElementById('exportLabel');
    const exportBarFill = document.getElementById('exportBarFill');
    const speedBtns = Array.from(document.querySelectorAll('.speed-btn'));
    const actJumpBtns = Array.from(document.querySelectorAll('[data-seek]'));

    let isPlaying = true;
    let isExporting = false;
    let currentTime = 0.0;
    let playbackSpeed = 1.0;
    let glitchScale = 1.0;
    let lastPerf = performance.now();
    let fpsSmoothed = 60;

    function updateSoundButton() {
      const on = soundEngine.monitorEnabled;
      soundBtn.textContent = on ? '🔊 Sound' : '🔇 Sound';
      soundBtn.classList.toggle('active', on);
    }

    async function toggleSound() {
      if (isExporting) return;
      const ok = await soundEngine.ensureReady();
      if (!ok) return;
      soundEngine.setMonitorEnabled(!soundEngine.monitorEnabled);
      updateSoundButton();
      if (soundEngine.monitorEnabled && isPlaying) {
        const st = computeState(currentTime, glitchScale);
        soundEngine.updateContinuous(st, true);
      } else {
        soundEngine.updateContinuous(computeState(currentTime, glitchScale), false);
      }
    }

    function updateHUD(st) {
      const pct = (st.t / DURATION) * 100;
      timelineProgress.style.width = `${pct.toFixed(2)}%`;
      timelineThumb.style.left = `${pct.toFixed(2)}%`;
      timelineTrack.setAttribute('aria-valuenow', st.t.toFixed(2));
      actPill.textContent = st.actLabel;
      actPill.classList.toggle('invert-active', st.invertMoon || st.invertClouds);
      timeReadout.textContent = `${st.t.toFixed(2)}s / ${DURATION.toFixed(2)}s · ${Math.round(fpsSmoothed)} fps`;
    }

    function setPlaying(val) {
      isPlaying = val;
      playPauseBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
      lastPerf = performance.now();
      soundEngine.updateContinuous(computeState(currentTime, glitchScale), isPlaying);
    }

    function seekTo(sec) {
      currentTime = mod(sec, DURATION);
      const st = renderFrame(stageCtx, currentTime, glitchScale);
      updateHUD(st);
      soundEngine.updateContinuous(st, isPlaying && !draggingTimeline);
    }

    function tick(now) {
      const dt = Math.min(0.1, (now - lastPerf) / 1000);
      lastPerf = now;

      if (dt > 0.001) {
        const instFps = 1 / dt;
        fpsSmoothed = fpsSmoothed * 0.9 + clamp(instFps, 1, 144) * 0.1;
      }

      if (isPlaying && !isExporting) {
        const prevT = currentTime;
        currentTime = mod(currentTime + dt * playbackSpeed, DURATION);
        const st = renderFrame(stageCtx, currentTime, glitchScale);
        updateHUD(st);
        soundEngine.updateContinuous(st, true);
        soundEngine.triggerCuesBetween(prevT, currentTime, glitchScale);
      }

      requestAnimationFrame(tick);
    }

    // Playback buttons
    playPauseBtn.addEventListener('click', () => {
      if (isExporting) return;
      setPlaying(!isPlaying);
    });

    restartBtn.addEventListener('click', () => {
      if (isExporting) return;
      seekTo(0);
    });

    soundBtn.addEventListener('click', toggleSound);

    // Clicking the canvas toggles sound on if currently muted, or pauses/plays if already unmuted
    stageCanvas.style.cursor = 'pointer';
    stageCanvas.addEventListener('click', () => {
      if (isExporting) return;
      if (!soundEngine.monitorEnabled) {
        toggleSound();
      } else {
        setPlaying(!isPlaying);
      }
    });

    // Speed buttons
    speedBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        playbackSpeed = parseFloat(btn.dataset.speed);
        speedBtns.forEach((b) => b.classList.toggle('active', b === btn));
      });
    });

    // Act jump buttons
    actJumpBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        if (isExporting) return;
        seekTo(parseFloat(btn.dataset.seek));
      });
    });

    // Glitch slider
    glitchSlider.addEventListener('input', () => {
      glitchScale = parseInt(glitchSlider.value, 10) / 100;
      glitchVal.textContent = `${glitchSlider.value}%`;
      if (!isPlaying && !isExporting) {
        const st = renderFrame(stageCtx, currentTime, glitchScale);
        updateHUD(st);
      }
    });

    // Interactive pointer scrubbing on timeline
    let draggingTimeline = false;
    function scrubFromPointer(clientX) {
      const rect = timelineTrack.getBoundingClientRect();
      const ratio = clamp((clientX - rect.left) / rect.width, 0, 0.9999);
      seekTo(ratio * DURATION);
    }

    timelineTrack.addEventListener('pointerdown', (e) => {
      if (isExporting) return;
      draggingTimeline = true;
      timelineTrack.setPointerCapture(e.pointerId);
      scrubFromPointer(e.clientX);
    });

    timelineTrack.addEventListener('pointermove', (e) => {
      if (!draggingTimeline || isExporting) return;
      scrubFromPointer(e.clientX);
    });

    timelineTrack.addEventListener('pointerup', () => {
      draggingTimeline = false;
      soundEngine.updateContinuous(computeState(currentTime, glitchScale), isPlaying);
    });

    // Keyboard shortcuts: Space (play/pause), R (restart), M (sound), Left/Right (step 0.1s)
    window.addEventListener('keydown', (e) => {
      if (isExporting) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(!isPlaying);
      } else if (e.key === 'r' || e.key === 'R') {
        seekTo(0);
      } else if (e.key === 'm' || e.key === 'M') {
        toggleSound();
      } else if (e.code === 'ArrowRight') {
        setPlaying(false);
        seekTo(currentTime + 0.1);
      } else if (e.code === 'ArrowLeft') {
        setPlaying(false);
        seekTo(currentTime - 0.1);
      }
    });

    // Helper for triggering download
    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function setExportUi(active, label = '', pct = 0) {
      isExporting = active;
      exportOverlay.classList.toggle('visible', active);
      exportLabel.textContent = label;
      exportBarFill.style.width = `${clamp(pct, 0, 100).toFixed(1)}%`;
      exportWebmBtn.disabled = active;
      exportGifBtn.disabled = active;
      playPauseBtn.disabled = active;
      soundBtn.disabled = active;
    }

    // Export WebM (1 exact 9.0s loop at 60 FPS with full synchronized stereo Opus audio!)
    exportWebmBtn.addEventListener('click', async () => {
      if (isExporting) return;
      if (typeof MediaRecorder === 'undefined' || !stageCanvas.captureStream) {
        alert('MediaRecorder WebM export is not supported in this browser.');
        return;
      }

      const wasPlaying = isPlaying;
      const savedTime = currentTime;

      // Unlock & prepare full-volume Web Audio export bus (works even if speaker preview is muted!)
      const audioOk = await soundEngine.ensureReady();
      const videoStream = stageCanvas.captureStream(60);
      const tracks = [...videoStream.getVideoTracks()];
      const audioTrack = audioOk ? soundEngine.getExportAudioTrack() : null;
      if (audioTrack) tracks.push(audioTrack);
      const combinedStream = new MediaStream(tracks);

      // Prefer WebM containers with explicit Opus audio + VP9/VP8 video
      const mimeCandidates = audioTrack
        ? [
            'video/webm;codecs=vp9,opus',
            'video/webm;codecs=vp8,opus',
            'video/webm;codecs=vp9',
            'video/webm;codecs=vp8',
            'video/webm'
          ]
        : ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
      const mimeType = mimeCandidates.find((m) => MediaRecorder.isTypeSupported(m)) || '';

      const recOptions = mimeType
        ? { mimeType, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 192_000 }
        : { videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 192_000 };

      const recorder = new MediaRecorder(combinedStream, recOptions);
      const chunks = [];

      recorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) chunks.push(ev.data);
      };

      recorder.onstop = () => {
        soundEngine.setExportMode(false);
        const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
        triggerDownload(blob, 'shoreline-moon-glitch.webm');
        setExportUi(false);
        seekTo(savedTime);
        setPlaying(wasPlaying);
      };

      // Prime frame 0 & ambient bed for 1 frame before starting MediaRecorder for clean frame-0 A/V sync
      setExportUi(true, 'Recording 9.0s WebM + audio…', 0);
      soundEngine.setExportMode(true);
      const st0 = renderFrame(stageCtx, 0, glitchScale);
      updateHUD(st0);
      soundEngine.updateContinuous(st0, true);
      await new Promise((r) => requestAnimationFrame(r));

      recorder.start();
      let startMs = null;
      let prevRecT = -0.001;
      let fadedOut = false;

      function stepRecord(now) {
        if (startMs === null) startMs = now;
        const elapsed = Math.max(0, (now - startMs) / 1000);
        if (elapsed >= DURATION) {
          soundEngine.triggerCuesBetween(prevRecT, DURATION, glitchScale);
          renderFrame(stageCtx, DURATION - 0.001, glitchScale);
          if (!fadedOut) {
            soundEngine.fadeOutExport(0.03);
            fadedOut = true;
          }
          setExportUi(true, 'Finalizing WebM video + audio…', 100);
          setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
          }, 45);
          return;
        }

        const st = renderFrame(stageCtx, elapsed, glitchScale);
        updateHUD(st);
        soundEngine.updateContinuous(st, true);
        soundEngine.triggerCuesBetween(prevRecT, elapsed, glitchScale);
        prevRecT = elapsed;

        if (!fadedOut && elapsed >= DURATION - 0.04) {
          soundEngine.fadeOutExport(0.035);
          fadedOut = true;
        }

        setExportUi(
          true,
          `Recording WebM + audio (${elapsed.toFixed(1)}s / ${DURATION.toFixed(1)}s)…`,
          (elapsed / DURATION) * 100
        );
        requestAnimationFrame(stepRecord);
      }
      requestAnimationFrame(stepRecord);
    });

    // Export GIF (1 exact 9.0s loop, 512x512 @ 20 FPS = 180 crisp frames, 100% offline LZW)
    exportGifBtn.addEventListener('click', async () => {
      if (isExporting) return;
      const wasPlaying = isPlaying;
      const savedTime = currentTime;

      const gifSize = 512;
      const fps = 20;
      const frameCount = Math.round(DURATION * fps); // 180 frames
      const delayCs = Math.round(100 / fps);         // 5 centiseconds (50ms)

      const scaleBuf = makeBuffer(gifSize, gifSize);
      const palette = buildScenePalette();
      const quantize = createQuantizer(palette);
      const indexedFrames = [];

      setExportUi(true, 'Rendering GIF frames (0%)…', 0);
      soundEngine.updateContinuous(computeState(currentTime, glitchScale), false);

      for (let i = 0; i < frameCount; i++) {
        const ft = (i / frameCount) * DURATION;
        const st = renderFrame(stageCtx, ft, glitchScale);
        updateHUD(st);

        scaleBuf.ctx.drawImage(stageCanvas, 0, 0, gifSize, gifSize);
        const imgData = scaleBuf.ctx.getImageData(0, 0, gifSize, gifSize);
        indexedFrames.push(quantize(imgData.data));

        if (i % 4 === 0 || i === frameCount - 1) {
          const pct = ((i + 1) / frameCount) * 82;
          setExportUi(true, `Rendering GIF frame ${i + 1} / ${frameCount}…`, pct);
          await new Promise((r) => setTimeout(r, 0));
        }
      }

      setExportUi(true, 'Encoding GIF89a LZW stream…', 90);
      await new Promise((r) => setTimeout(r, 20));

      const gifBytes = encodeGif89a(indexedFrames, gifSize, gifSize, palette, delayCs);
      const blob = new Blob([gifBytes], { type: 'image/gif' });
      triggerDownload(blob, 'shoreline-moon-glitch.gif');

      setExportUi(false);
      seekTo(savedTime);
      setPlaying(wasPlaying);
    });

    // Expose a tiny debug/inspection handle on window for deterministic keyframe verification
    window.__shorelineApp = {
      seek: (sec) => { setPlaying(false); seekTo(sec); },
      play: () => setPlaying(true),
      pause: () => setPlaying(false),
      setGlitch: (val) => {
        glitchScale = val;
        glitchSlider.value = String(Math.round(val * 100));
        glitchVal.textContent = `${glitchSlider.value}%`;
        const st = renderFrame(stageCtx, currentTime, glitchScale);
        updateHUD(st);
      },
      testGifEncodeSmall: () => {
        // Quick verification helper to test LZW encoder integrity on 4 frames at 128x128
        const s = 128;
        const buf = makeBuffer(s, s);
        const pal = buildScenePalette();
        const q = createQuantizer(pal);
        const frames = [];
        for (const tVal of [0.0, 3.2, 6.6, 8.5]) {
          renderFrame(stageCtx, tVal, 1.0);
          buf.ctx.drawImage(stageCanvas, 0, 0, s, s);
          frames.push(q(buf.ctx.getImageData(0, 0, s, s).data));
        }
        const bytes = encodeGif89a(frames, s, s, pal, 5);
        return { byteLength: bytes.length, header: String.fromCharCode(...bytes.slice(0, 6)), trailer: bytes[bytes.length - 1] };
      }
    };

    // Mute ambient preview bed smoothly if user switches tabs (unless exporting)
    document.addEventListener('visibilitychange', () => {
      if (isExporting) return;
      soundEngine.updateContinuous(computeState(currentTime, glitchScale), isPlaying && !document.hidden);
    });

    // Initial render + start loop
    const initSt = renderFrame(stageCtx, 0, glitchScale);
    updateHUD(initSt);
    requestAnimationFrame(tick);
  })();
  </script>
